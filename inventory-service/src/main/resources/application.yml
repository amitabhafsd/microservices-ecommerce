
spring:
  application:
    name: INVENTORY-SERVICE
  config:
    import: optional:configserver:http://localhost:8888
  cloud:
    config:
      name: inventory-service

  datasource:
    url: jdbc:postgresql://localhost:5432/inventory_db
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

  kafka:
    bootstrap-servers: localhost:9092
