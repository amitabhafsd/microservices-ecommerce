server:
  port: 8081
eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db?options=-c%20TimeZone=Asia/Kolkata
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
jwt:
  secret: mysecretkeymysecretkeymysecretkey
  expiration: 3600000
