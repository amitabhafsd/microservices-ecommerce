spring:
  profiles:
    ## active: native will be the one responsible for local native configs
    ## mentioned in the config server
    ## rather than a centralized git repository
    active: native
  cloud:
    gateway:
      routes:
        - id: order-service
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/api/orders/**
          filters:
            - JwtAuthenticationFilter

        - id: payment-service
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/api/payments/**
          filters:
            - JwtAuthenticationFilter

        - id: inventory-service
          uri: lb://INVENTORY-SERVICE
          predicates:
            - Path=/api/inventory/**
          filters:
            - JwtAuthenticationFilter

        - id: product-service
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/api/products/**
          filters:
            - JwtAuthenticationFilter

        - id: notification-service
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/api/notification/**
          filters:
            - JwtAuthenticationFilter
    config:
      server:
        ## native:
        ##   search-locations: classpath:/config
        git:
          uri: https://github.com/amitabhafsd/microservices-ecommerce/config
          clone-on-start: true
  application:
    name: CONFIG-SERVER
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
server:
  port: 8888
